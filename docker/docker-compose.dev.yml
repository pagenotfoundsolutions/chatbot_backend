version: '3.8'

name: ${PROJECT_NAME:-chatbot}_dev

services:
  app:
    container_name: ${PROJECT_NAME:-chatbot}_dev_app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Sync source code for hot reloading
      - ../:/app
      # Store uploads in a managed Docker volume instead of syncing to host
      - app_uploads:/app/${UPLOAD_DIR:-storage/uploads}
    env_file:
      - ../env/.env.dev
    environment:
      - APP_ENV=dev
    depends_on:
      - db
    # Override the command to use auto-reload in dev mode
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    container_name: ${PROJECT_NAME:-chatbot}_dev_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   depends_on:
  #     - db

volumes:
  db_data:
    name: ${PROJECT_NAME:-chatbot}_dev_db_data
  app_uploads:
    name: ${PROJECT_NAME:-chatbot}_dev_app_uploads
