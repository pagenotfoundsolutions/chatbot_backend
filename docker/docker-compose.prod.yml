version: '3.8'

name: ${PROJECT_NAME:-chatbot}_prod

services:
  app:
    container_name: ${PROJECT_NAME:-chatbot}_prod_app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Store uploads in a managed Docker volume
      - app_uploads:/app/${UPLOAD_DIR:-storage/uploads}
    env_file:
      - ../env/.env.prod
    environment:
      - APP_ENV=prod
    networks:
      - shared-db-net
    # In production, we don't use auto-reload
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   networks:
  #     - shared-db-net

volumes:
  app_uploads:
    name: ${PROJECT_NAME:-chatbot}_prod_app_uploads

networks:
  shared-db-net:
    external: true
