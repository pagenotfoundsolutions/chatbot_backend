name: ${PROJECT_NAME:-chatbot}_prod

services:
  app:
    container_name: ${PROJECT_NAME:-chatbot}_prod_app
    image: ${WORKER_IMAGE:-${PROJECT_NAME:-chatbot}_prod_app:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Store uploads in a managed Docker volume
      - app_uploads:/app/${UPLOAD_DIR:-storage/uploads}
    env_file:
      - ../env/.env.prod
    environment:
      - APP_ENV=prod
    networks:
      - shared-db-net
    # Wait for DB → run migrations → start server
    command:
      - /bin/bash
      - -c
      - |
        echo '⏳ Waiting for database to be ready...'
        until pg_isready -h shared-postgres -p 5432 -U ${POSTGRES_USER:-chatbot_db}; do
          echo '  DB not ready yet, retrying in 3s...'
          sleep 3
        done
        echo '✅ Database is ready!'
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   networks:
  #     - shared-db-net

volumes:
  app_uploads:
    name: ${PROJECT_NAME:-chatbot}_prod_app_uploads

networks:
  shared-db-net:
    external: true
