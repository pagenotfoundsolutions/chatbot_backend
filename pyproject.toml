[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # --- Database & ORM ---
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.50",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.3.6",
    # --- Web Framework & API ---
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    # --- LangChain Ecosystem (Modular & Lightweight) ---
    "langchain-core>=0.3.0",
    "langchain>=1.3.7",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=0.2.0",

    # --- AI Models / Providers ---
    "langchain-openai>=1.3.2",
    "langchain-nvidia-ai-endpoints",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-huggingface>=1.2.2",

    # --- RAG Search Tools ---
    "flashrank>=0.2.8", # Reranking models for better search
    "duckduckgo-search", # Web search capability
    "ddgs", # Required by latest langchain for DuckDuckGo
    "wikipedia>=1.4.0", # Wikipedia search capability
    # --- Data Processing & Document Parsers ---
    "pandas>=3.0.3",
    "openpyxl>=3.1.5", # Excel parser
    "docx2txt>=0.9", # Word document parser
    "pypdf>=6.12.2", # PDF parser
    "beautifulsoup4>=4.15.0", # HTML parser
    "pytesseract>=0.3.13", # OCR for images
    "pillow>=12.2.0", # Image processing
    # --- Security & Math Utilities ---
    "bcrypt>=5.0.0", # Password hashing
    "pyjwt>=2.13.0", # JWT Authentication
    "numexpr>=2.10.0", # Safe math evaluation
]


