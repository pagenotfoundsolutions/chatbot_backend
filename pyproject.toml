[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.15.0",
    "docx2txt>=0.9",
    "fastapi>=0.136.3",
    "flashrank>=0.2.8",
    "jq>=1.11.0",
    "langchain>=1.3.7",
    "langchain-anthropic>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-nvidia-ai-endpoints>=1.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.2",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=0.2.0",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.3.6",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pypdf>=6.12.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
# Install only the provider(s) you use, e.g. `uv sync --extra anthropic`.
# `echo` (the default LLM_PROVIDER) needs none of these.
anthropic = ["langchain-anthropic>=0.3.0"]
openai = ["langchain-openai>=0.2.0"]
ollama = ["langchain-ollama>=0.2.0"]
